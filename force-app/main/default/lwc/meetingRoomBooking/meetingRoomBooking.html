<template>
    <lightning-card title="Meeting Room Booking System" icon-name="standard:event">
        <div class="slds-m-around_medium">
            <lightning-tabset active-tab-value={activeTab} onselect={handleTabChange}>

                <!-- ── Calendar View ── -->
                <lightning-tab label="Calendar View" value="calendar">
                    <div class="calendar-container">
                        <div class="slds-grid slds-gutters slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <div class="slds-form-element">
                                    <label class="slds-form-element__label">Select Date</label>
                                    <div class="slds-form-element__control">
                                        <input type="date" class="slds-input"
                                            value={selectedDate}
                                            onchange={handleDateChange} />
                                    </div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-combobox
                                    label="Select Room"
                                    value={selectedRoom}
                                    options={roomOptions}
                                    onchange={handleRoomChange}
                                    placeholder="All Rooms">
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-3 slds-align-bottom">
                                <lightning-button label="Today" onclick={handleTodayClick}
                                    variant="neutral" class="slds-m-top_medium">
                                </lightning-button>
                            </div>
                        </div>

                        <!-- Calendar Grid -->
                        <div class="calendar-grid" style={gridStyle}>
                            <div class="time-column-header">Time</div>
                            <template for:each={filteredRooms} for:item="room">
                                <div key={room.value} class="room-header">{room.label}</div>
                            </template>
                            <template for:each={timeSlots} for:item="slot">
                                <div key={slot.time} class="calendar-row" role="row">
                                    <div class="time-label" role="gridcell">{slot.label}</div>
                                    <template for:each={slot.roomCells} for:item="cell">
                                        <div key={cell.roomId}
                                            class={cell.computedClass}
                                            data-room={cell.roomId}
                                            data-time={slot.time}
                                            onclick={handleSlotClick}
                                            title={cell.tooltip}
                                            role="gridcell">
                                            <template if:true={cell.isBooked}>
                                                <div class="booking-info">
                                                    <div class="booking-title">{cell.bookingTitle}</div>
                                                    <div class="booking-time">{cell.timeRange}</div>
                                                </div>
                                            </template>
                                            <template if:true={cell.restricted}>
                                                <div class="booking-info">
                                                    <div class="booking-title restrict-icon">🔒</div>
                                                </div>
                                            </template>

                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <!-- Legend -->
                        <div class="slds-grid slds-gutters slds-m-top_medium">
                            <div class="slds-col">
                                <span class="legend-item"><span class="legend-box available"></span> Available</span>
                                <span class="legend-item"><span class="legend-box booked"></span> Booked</span>
                                <span class="legend-item"><span class="legend-box restricted"></span> 🔒 Restricted</span>
                                <span class="legend-item"><span class="legend-box needs-approval"></span> ⏳ Needs Approval</span>
                            </div>
                        </div>
                    </div>
                </lightning-tab>

                <!-- ── Create Booking ── -->
                <lightning-tab label="Create Booking" value="create">
                    <div class="slds-box slds-theme_default">
                        <h3 class="slds-text-heading_small slds-m-bottom_medium">New Booking Details</h3>

                        <template if:true={preselectedSlot}>
                            <div class="slds-box slds-theme_info slds-m-bottom_medium">
                                <p><strong>Selected:</strong> {preselectedSlot.room} at {preselectedSlot.timeLabel}</p>
                                <lightning-button label="Clear Selection" onclick={clearPreselection}
                                    variant="neutral" class="slds-m-top_small">
                                </lightning-button>
                            </div>
                        </template>

                        <template if:false={showFlow}>
                            <div class="slds-grid slds-gutters slds-wrap">

                                <!-- Row 1: Room + Employee -->
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-combobox label="Room Name"
                                        value={formData.roomId} options={roomOptions}
                                        onchange={handleRoomPick} required>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-4">
                                    <lightning-input label="Employee Name"
                                        value={formData.employeeName}
                                        onchange={handleFormChange}
                                        data-field="employeeName" required>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-4">
                                    <lightning-input
                                        type="email"
                                        label="Employee Email"
                                        value={formData.employeeEmail}
                                        onchange={handleFormChange}
                                        data-field="employeeEmail"
                                        placeholder="attendee@company.com">
                                    </lightning-input>
                                </div>

                                <!-- Row 2: Start Time (date + time side by side under one label) -->
                                <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">*</abbr> Start Time
                                        </label>
                                        <div class="slds-form-element__control datetime-compound">
                                            <input type="date" class="slds-input datetime-date"
                                                value={formData.startDate}
                                                data-field="startDate"
                                                onchange={handleRawInputChange} />
                                            <input type="time" class="slds-input datetime-time"
                                                value={formData.startTime24}
                                                data-field="startTime24"
                                                onchange={handleRawInputChange} />
                                        </div>
                                    </div>
                                </div>

                                <!-- Row 2: End Time (date + time side by side under one label) -->
                                <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">*</abbr> End Time
                                        </label>
                                        <div class="slds-form-element__control datetime-compound">
                                            <input type="date" class="slds-input datetime-date"
                                                value={formData.endDate}
                                                data-field="endDate"
                                                onchange={handleRawInputChange} />
                                            <input type="time" class="slds-input datetime-time"
                                                value={formData.endTime24}
                                                data-field="endTime24"
                                                onchange={handleRawInputChange} />
                                        </div>
                                    </div>
                                </div>

                            </div>

                            <div class="slds-m-top_medium">
                                <lightning-button label="Check Availability"
                                    onclick={checkAvailability} variant="neutral"
                                    class="slds-m-right_small" disabled={isCreating}>
                                </lightning-button>
                                <lightning-button label="Create Booking"
                                    onclick={createBooking} variant="brand"
                                    disabled={isCreating}>
                                </lightning-button>
                            </div>
                        </template>

                        <template if:true={conflictMessage}>
                            <div class="slds-box slds-theme_error slds-m-top_medium">
                                <p><lightning-icon icon-name="utility:error" size="small"
                                    class="slds-m-right_x-small"></lightning-icon> {conflictMessage}</p>
                            </div>
                        </template>
                        <template if:true={successMessage}>
                            <div class="slds-box slds-theme_success slds-m-top_medium">
                                <p><lightning-icon icon-name="utility:success" size="small"
                                    class="slds-m-right_x-small"></lightning-icon> {successMessage}</p>
                                <template if:true={newBookingMeetingLink}>
                                    <p class="slds-m-top_x-small">
                                        <a href={newBookingMeetingLink} target="_blank" class="teams-link-success">
                                            &#128248; Join Teams Meeting
                                        </a>
                                    </p>
                                </template>
                            </div>
                        </template>
                    </div>
                </lightning-tab>

                <!-- ── All Bookings ── -->
                <lightning-tab label="All Bookings" value="list">
                    <div class="slds-box slds-theme_default">

                        <!-- Header + Search + Refresh -->
                        <div class="slds-grid slds-gutters slds-align_absolute-center slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-4">
                                <h3 class="slds-text-heading_small">Current &amp; Upcoming Bookings</h3>
                                <p class="slds-text-body_small slds-text-color_weak">{filteredBookingCount} record(s)</p>
                            </div>
                            <div class="slds-col slds-size_2-of-4">
                                <div class="search-wrap">
                                    <span class="search-icon">&#128269;</span>
                                    <input
                                        type="text"
                                        class="search-input"
                                        placeholder="Search by Booking #, Room, or Employee..."
                                        value={bookingSearch}
                                        onkeyup={handleBookingSearch} />
                                    <template if:true={bookingSearch}>
                                        <button class="search-clear" onclick={clearBookingSearch}>✕</button>
                                    </template>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-4 slds-text-align_right">
                                <lightning-button label="Refresh" onclick={refreshBookings}
                                    icon-name="utility:refresh" variant="neutral">
                                </lightning-button>
                            </div>
                        </div>

                        <template if:true={hasFilteredBookings}>
                            <div class="bookings-table-wrap">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th class="sortable-th" data-col="Name" onclick={handleSort}>
                                                <span>Booking #</span>
                                                <span class={sortIconClass.Name}>{sortIcon.Name}</span>
                                            </th>
                                            <th class="sortable-th" data-col="RoomName" onclick={handleSort}>
                                                <span>Room</span>
                                                <span class={sortIconClass.RoomName}>{sortIcon.RoomName}</span>
                                            </th>
                                            <th class="sortable-th" data-col="EmployeeName" onclick={handleSort}>
                                                <span>Employee</span>
                                                <span class={sortIconClass.EmployeeName}>{sortIcon.EmployeeName}</span>
                                            </th>
                                            <th class="sortable-th" data-col="DisplayStart" onclick={handleSort}>
                                                <span>Start Time</span>
                                                <span class={sortIconClass.DisplayStart}>{sortIcon.DisplayStart}</span>
                                            </th>
                                            <th class="sortable-th" data-col="DisplayEnd" onclick={handleSort}>
                                                <span>End Time</span>
                                                <span class={sortIconClass.DisplayEnd}>{sortIcon.DisplayEnd}</span>
                                            </th>
                                            <th class="sortable-th" data-col="Status" onclick={handleSort}>
                                                <span>Status</span>
                                                <span class={sortIconClass.Status}>{sortIcon.Status}</span>
                                            </th>
                                            <th>Meeting Link</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={filteredBookings} for:item="b">
                                            <tr key={b.Id}>
                                                <td class="booking-name">{b.Name}</td>
                                                <td>{b.RoomName}</td>
                                                <td>{b.EmployeeName}</td>
                                                <td class="booking-time">{b.DisplayStart}</td>
                                                <td class="booking-time">{b.DisplayEnd}</td>
                                                <td>
                                                    <span class={b.statusClass}>{b.Status}</span>
                                                </td>
                                                <td>
                                                    <template if:true={b.MeetingLink}>
                                                        <a href={b.MeetingLink} target="_blank"
                                                            class="teams-link" title="Join Teams Meeting">
                                                            &#128248; Join
                                                        </a>
                                                    </template>
                                                    <template if:false={b.MeetingLink}>
                                                        <span class="link-pending" title="Link generating...">⏳</span>
                                                    </template>
                                                </td>
                                                <td>
                                                    <button
                                                        class="cancel-btn"
                                                        data-id={b.Id}
                                                        data-name={b.Name}
                                                        onclick={handleCancelBooking}
                                                        disabled={isLoading}
                                                        title="Cancel this booking">
                                                        Cancel
                                                    </button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:false={hasFilteredBookings}>
                            <div class="slds-text-align_center slds-p-vertical_large">
                                <template if:true={bookingSearch}>
                                    <p class="slds-text-color_weak">No bookings match &ldquo;{bookingSearch}&rdquo;</p>
                                </template>
                                <template if:false={bookingSearch}>
                                    <p class="slds-text-color_weak">No upcoming bookings found</p>
                                </template>
                            </div>
                        </template>
                    </div>
                </lightning-tab>



                <!-- ── Audit Log ── -->
                <lightning-tab label="Audit Log" value="audit">
                    <div class="slds-box slds-theme_default">
                        <!-- Filters -->
                        <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
                                <h3 class="slds-text-heading_small">Booking Audit Log</h3>
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-combobox
                                    label="Action"
                                    value={auditFilter.action}
                                    options={auditActionOptions}
                                    onchange={handleAuditFilterChange}
                                    data-field="action">
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-input
                                    label="Changed By"
                                    value={auditFilter.user}
                                    onchange={handleAuditFilterChange}
                                    data-field="user"
                                    placeholder="Search name...">
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <div class="slds-form-element">
                                    <label class="slds-form-element__label">Date</label>
                                    <div class="slds-form-element__control">
                                        <input type="date" class="slds-input"
                                            value={auditFilter.date}
                                            data-field="date"
                                            onchange={handleAuditDateChange} />
                                    </div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-4 slds-align-bottom">
                                <lightning-button label="Search" variant="brand"
                                    onclick={loadAuditLogs} class="slds-m-right_x-small">
                                </lightning-button>
                                <lightning-button label="Clear" variant="neutral"
                                    onclick={clearAuditFilters}>
                                </lightning-button>
                            </div>
                        </div>

                        <!-- Results count -->
                        <template if:true={auditTotalCount}>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                                {auditTotalCount} record(s) found — showing {auditLogs.length}
                            </p>
                        </template>

                        <!-- Table -->
                        <template if:true={hasAuditLogs}>
                            <div class="audit-table-wrap">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped audit-table">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th>Timestamp</th>
                                            <th>Action</th>
                                            <th>Booking #</th>
                                            <th>Room</th>
                                            <th>Employee</th>
                                            <th>Changed By</th>
                                            <th>Fields Changed</th>
                                            <th>Detail</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={auditLogs} for:item="log">
                                            <tr key={log.Id}>
                                                <td class="audit-ts">{log.TimestampDisplay}</td>
                                                <td>
                                                    <span class={log.actionBadgeClass}>{log.Action}</span>
                                                </td>
                                                <td>{log.BookingName}</td>
                                                <td>{log.RoomName}</td>
                                                <td>{log.EmployeeName}</td>
                                                <td>{log.ChangedBy}</td>
                                                <td class="audit-fields">{log.ChangedFields}</td>
                                                <td class="audit-detail">{log.detailText}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Pagination -->
                            <div class="slds-grid slds-grid_align-center slds-m-top_medium">
                                <lightning-button label="Previous" variant="neutral"
                                    onclick={auditPrevPage} disabled={isFirstAuditPage}
                                    class="slds-m-right_small">
                                </lightning-button>
                                <span class="slds-align-middle slds-m-horizontal_small audit-page-label">
                                    Page {auditPage} of {auditTotalPages}
                                </span>
                                <lightning-button label="Next" variant="neutral"
                                    onclick={auditNextPage} disabled={isLastAuditPage}
                                    class="slds-m-left_small">
                                </lightning-button>
                            </div>
                        </template>

                        <template if:false={hasAuditLogs}>
                            <div class="slds-text-align_center slds-p-vertical_large">
                                <p class="slds-text-color_weak">No audit records found</p>
                            </div>
                        </template>
                    </div>
                </lightning-tab>

                <!-- ── Approvals ── -->
                <lightning-tab label="Approvals" value="approvals">
                    <div class="slds-box slds-theme_default">
                        <div class="slds-grid slds-gutters slds-m-bottom_medium">
                            <div class="slds-col">
                                <h3 class="slds-text-heading_small">Pending Board Room Approvals</h3>
                                <p class="slds-text-body_small slds-text-color_weak">{pendingApprovalCount} pending</p>
                            </div>
                            <div class="slds-col slds-text-align_right">
                                <lightning-button label="Refresh" onclick={loadPendingApprovals}
                                    icon-name="utility:refresh" variant="neutral">
                                </lightning-button>
                            </div>
                        </div>

                        <template if:true={hasPendingApprovals}>
                            <div class="approvals-list">
                                <template for:each={pendingApprovals} for:item="appr">
                                    <div key={appr.BookingId} class="approval-card">
                                        <div class="approval-info">
                                            <div class="approval-booking">{appr.BookingName}</div>
                                            <div class="approval-meta">
                                                <span class="approval-room">{appr.RoomName}</span>
                                                <span class="approval-sep">·</span>
                                                <span>{appr.EmployeeName}</span>
                                                <span class="approval-sep">·</span>
                                                <span>{appr.StartTime} – {appr.EndTime}</span>
                                            </div>
                                            <template if:true={appr.PendingWith}>
                                                <div class="approval-pending-with">Pending with: {appr.PendingWith}</div>
                                            </template>
                                        </div>
                                        <div class="approval-actions">
                                            <button class="approve-btn"
                                                data-id={appr.BookingId}
                                                onclick={handleApprove}
                                                disabled={isLoading}>
                                                ✓ Approve
                                            </button>
                                            <button class="reject-btn"
                                                data-id={appr.BookingId}
                                                onclick={handleReject}
                                                disabled={isLoading}>
                                                ✕ Reject
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <template if:false={hasPendingApprovals}>
                            <div class="slds-text-align_center slds-p-vertical_large">
                                <p class="slds-text-color_weak">No pending approvals</p>
                            </div>
                        </template>
                    </div>
                </lightning-tab>

                <!-- ── Reject Modal ── -->
                <template if:true={showRejectModal}>
                    <div class="cancel-modal-backdrop" onclick={handleRejectModalClose}></div>
                    <div class="cancel-modal" role="dialog">
                        <div class="cancel-modal-header">
                            <span class="cancel-modal-title">Reject Booking</span>
                            <button class="cancel-modal-close" onclick={handleRejectModalClose}>✕</button>
                        </div>
                        <div class="cancel-modal-body">
                            <p>Add a reason for rejection (optional):</p>
                            <lightning-textarea
                                label="Comments"
                                value={rejectComments}
                                onchange={handleRejectCommentsChange}
                                max-length="500"
                                class="slds-m-top_small">
                            </lightning-textarea>
                        </div>
                        <div class="cancel-modal-footer">
                            <lightning-button label="Cancel" variant="neutral"
                                onclick={handleRejectModalClose} class="slds-m-right_small">
                            </lightning-button>
                            <lightning-button label="Confirm Reject" variant="destructive"
                                onclick={handleRejectConfirm}>
                            </lightning-button>
                        </div>
                    </div>
                </template>
            </lightning-tabset>
        </div>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <!-- ── Cancel Confirmation Modal ── -->
        <template if:true={showCancelModal}>
            <div class="cancel-modal-backdrop" onclick={handleCancelModalClose}></div>
            <div class="cancel-modal" role="dialog" aria-modal="true">
                <div class="cancel-modal-header">
                    <lightning-icon icon-name="utility:warning" variant="warning"
                        size="small" class="slds-m-right_small">
                    </lightning-icon>
                    <span class="cancel-modal-title">Cancel Booking</span>
                    <button class="cancel-modal-close" onclick={handleCancelModalClose}
                        title="Close">✕</button>
                </div>
                <div class="cancel-modal-body">
                    <p>Are you sure you want to cancel <strong>{cancelTargetName}</strong>?</p>
                    <p class="cancel-modal-sub">This action cannot be undone. The time slot will become available for others.</p>
                </div>
                <div class="cancel-modal-footer">
                    <lightning-button label="Keep Booking" variant="neutral"
                        onclick={handleCancelModalClose} class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button label="Yes, Cancel Booking" variant="destructive"
                        onclick={handleCancelConfirm}>
                    </lightning-button>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
